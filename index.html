<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店竞对监控系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
        <!-- Main Card -->
        <div class="bg-white rounded-[24px] shadow-2xl w-full max-w-6xl overflow-hidden flex h-[700px]">
            
            <!-- Left Side: Illustration -->
            <div class="hidden md:flex w-3/5 bg-[#f0f5ff] items-center justify-center p-12 relative overflow-hidden">
                <!-- Background decoration -->
                <div class="absolute top-0 left-0 w-full h-full">
                    <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
                    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-purple-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
                </div>
                
                <!-- CSS 3D Illustration -->
                <div class="relative z-10 w-full h-full flex flex-col items-center justify-center text-center">
                    <div class="mb-8 relative">
                        <!-- 3D Scene Container -->
                        <div class="relative w-96 h-80 mx-auto">
                            <!-- Computer Monitor -->
                            <div class="absolute top-8 left-1/2 transform -translate-x-1/2 w-48 h-32 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg shadow-2xl">
                                <div class="w-full h-full bg-gradient-to-br from-blue-400 to-blue-500 rounded-lg p-3">
                                    <div class="w-full h-full bg-white rounded flex items-center justify-center">
                                        <div class="text-blue-600 text-xs font-bold">数据监控</div>
                                    </div>
                                </div>
                                <!-- Monitor Stand -->
                                <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 w-8 h-6 bg-gray-400 rounded-b"></div>
                                <div class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 w-16 h-2 bg-gray-500 rounded"></div>
                            </div>
                            
                            <!-- Floating Data Cards -->
                            <div class="absolute top-4 left-8 w-20 h-16 bg-white rounded-lg shadow-lg transform rotate-12 border border-blue-100">
                                <div class="p-2 text-xs text-blue-600 font-semibold">价格分析</div>
                            </div>
                            <div class="absolute top-12 right-8 w-20 h-16 bg-white rounded-lg shadow-lg transform -rotate-12 border border-purple-100">
                                <div class="p-2 text-xs text-purple-600 font-semibold">竞争监控</div>
                            </div>
                            <div class="absolute bottom-16 left-4 w-20 h-16 bg-white rounded-lg shadow-lg transform rotate-6 border border-green-100">
                                <div class="p-2 text-xs text-green-600 font-semibold">实时预警</div>
                            </div>
                            
                            <!-- 3D People Icons -->
                            <div class="absolute bottom-8 left-12 w-8 h-12 bg-gradient-to-b from-blue-400 to-blue-500 rounded-full">
                                <div class="w-4 h-4 bg-blue-300 rounded-full mx-auto mt-1"></div>
                                <div class="w-6 h-6 bg-blue-400 rounded mx-auto mt-1"></div>
                            </div>
                            <div class="absolute bottom-8 right-16 w-8 h-12 bg-gradient-to-b from-purple-400 to-purple-500 rounded-full">
                                <div class="w-4 h-4 bg-purple-300 rounded-full mx-auto mt-1"></div>
                                <div class="w-6 h-6 bg-purple-400 rounded mx-auto mt-1"></div>
                            </div>
                            
                            <!-- Connecting Lines -->
                            <div class="absolute top-20 left-1/2 w-px h-8 bg-gradient-to-b from-blue-300 to-transparent transform -translate-x-1/2"></div>
                            <div class="absolute top-16 left-1/4 w-16 h-px bg-gradient-to-r from-blue-300 to-transparent transform rotate-45"></div>
                            <div class="absolute top-16 right-1/4 w-16 h-px bg-gradient-to-l from-purple-300 to-transparent transform -rotate-45"></div>
                        </div>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">智能竞价监控系统</h2>
                    <p class="text-gray-500">实时数据分析 · 智能决策支持</p>
                </div>
            </div>

            <!-- Right Side: Login Form -->
            <div class="w-full md:w-2/5 p-12 lg:p-16 flex flex-col justify-center bg-white relative z-20">
                <div class="w-full max-w-sm mx-auto">
                    <!-- Title -->
                    <h1 class="text-3xl font-bold text-gray-900 text-center mb-12">欢迎登录</h1>

                    <!-- Form -->
                    <form id="loginForm" class="space-y-10">
                        <div class="space-y-6">
                            <!-- Username -->
                            <div class="relative">
                                <input 
                                    type="text" 
                                    id="username" 
                                    name="username"
                                    required
                                    class="w-full py-3 border-b border-gray-200 text-gray-900 focus:border-blue-600 outline-none transition-colors bg-transparent placeholder-transparent peer"
                                    placeholder="请输入账号"
                                >
                                <label for="username" class="absolute left-0 -top-3.5 text-gray-600 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3 peer-focus:-top-3.5 peer-focus:text-gray-600 peer-focus:text-sm">
                                    请输入账号
                                </label>
                            </div>

                            <!-- Password -->
                            <div class="relative">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password"
                                    required
                                    class="w-full py-3 border-b border-gray-200 text-gray-900 focus:border-blue-600 outline-none transition-colors bg-transparent placeholder-transparent peer"
                                    placeholder="请输入密码"
                                >
                                <label for="password" class="absolute left-0 -top-3.5 text-gray-600 text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3 peer-focus:-top-3.5 peer-focus:text-gray-600 peer-focus:text-sm">
                                    请输入密码
                                </label>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div id="errorMessage" class="hidden text-red-500 text-sm text-center">
                            用户名或密码错误
                        </div>

                        <!-- Submit Button -->
                        <button 
                            type="submit"
                            class="w-full bg-blue-600 text-white py-4 rounded-lg font-medium hover:bg-blue-700 transition-all transform hover:-translate-y-0.5 shadow-lg shadow-blue-600/30"
                        >
                            登 录
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 用户配置
        const USERS = {
            'admin': 'hotel2024',
            'user1': 'pass123',
            'user2': 'pass456',
            'user3': 'pass789'
        };
        
        const LOGIN_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;

        // 检查登录状态
        function checkAuth() {
            const loggedIn = localStorage.getItem('loggedIn');
            const loginTime = parseInt(localStorage.getItem('loginTime') || '0');
            return loggedIn === 'true' && (Date.now() - loginTime) < LOGIN_EXPIRY_MS;
        }

        // 如果已登录，直接跳转
        if (checkAuth()) {
            window.location.href = 'dashboard.html';
        }

        // 登录表单处理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            
            if (USERS[username] === password) {
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('username', username);
                localStorage.setItem('loginTime', Date.now().toString());
                window.location.href = 'dashboard.html';
            } else {
                errorEl.classList.remove('hidden');
                // Shake animation for visual feedback
                const btn = this.querySelector('button');
                btn.classList.add('bg-red-600');
                setTimeout(() => {
                    errorEl.classList.add('hidden');
                    btn.classList.remove('bg-red-600');
                }, 2000);
            }
        });
    </script>
</body>
</html>
